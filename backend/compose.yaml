name: contenedores-backend
x-api: &api
  image: contenedores-backend:local
  environment: &environment
    DB_HOST: mysql
    DB_NAME: contenedores
    DB_USER: appuser
    DB_PASSWORD: ${DB_PASSWORD:?Copia .env.example a .env}
    DB_SSL: 'false'
    APP_VERSION: ${APP_VERSION:-v1}
    APP_ENV: docker-local
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: contenedores
      MYSQL_USER: appuser
      MYSQL_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -u"$$MYSQL_USER" -D"$$MYSQL_DATABASE" -e "SELECT 1"']
      interval: 5s
      timeout: 5s
      retries: 40
  migrate:
    <<: *api
    command: [node, src/init-db.mjs]
    healthcheck:
      disable: true
    depends_on:
      mysql:
        condition: service_healthy
  api:
    <<: *api
    build: .
    ports: ['127.0.0.1:3000:3000']
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  mysql-data:
